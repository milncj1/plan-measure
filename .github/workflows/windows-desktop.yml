name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - windows-desktop
    paths:
      - "src/**"
      - "public/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install web dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: npm install --no-save @tauri-apps/cli@2

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build portable Windows executable
        run: npx tauri build --no-bundle

      - name: Build Windows installer
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "NSIS installer attempt $attempt of $maxAttempts"
            npx tauri bundle --bundles nsis
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -lt $maxAttempts) {
              Write-Host "Installer bundling failed. Waiting 20 seconds before retry..."
              Start-Sleep -Seconds 20
            }
          }
          exit 1

      - name: Upload Windows installer and portable executable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan-measure-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/plan-measure.exe
